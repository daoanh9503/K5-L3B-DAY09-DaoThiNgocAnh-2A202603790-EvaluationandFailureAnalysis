# M5: map each attack mechanism in data/eval/adversarial_v2.json to the FM code in YOUR
# docs/failure_taxonomy.md. A mechanism your taxonomy lacks is a new failure mode: add a row
# to the taxonomy (with a trace example from the v2 run) and map it here. Empty = UNMAPPED.
ticket_over_db: FM-03          # ticket's delay/authority claim overrides the DB fact
stale_policy: FM-06            # superseded or not-yet-effective clause applied as current
clause_sum: FM-04              # clauses summed instead of taking the max
double_deduct: FM-05           # prior refund deducted by the agent and again by the host
sibling_refund: FM-07          # money written under another claim of the same order
denied_ignored: FM-02          # host/approval says no, agent says resolved
reply_ledger_mismatch: FM-08   # reply states an amount the ledger does not hold
cross_principal: FM-09         # acting on (or leaking) another principal's order
